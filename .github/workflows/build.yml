# Builds Crate XL in the cloud on every push: Android APK, Windows app, macOS app.
# The results are attached to each run under "Artifacts".
name: Build Crate XL

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Get JUCE
        run: git clone --depth 1 --branch 9.0.4 https://github.com/juce-framework/JUCE.git JUCE
      - name: Debug signing key
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkeypair -v -keystore ~/.android/debug.keystore -storetype JKS \
            -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK
        working-directory: Builds/Android
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find Builds/Android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK: $APK"
          cp "$APK" "dist/Crate XL.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Crate-XL-Android
          path: dist/Crate XL.apk

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem build/Crate_artefacts/Release -Filter *.exe | Sort-Object LastWriteTime | Select-Object -Last 1 | Copy-Item -Destination "dist/Crate XL.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Crate-XL-Windows
          path: dist/Crate XL.exe

  macos:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Collect
        run: |
          mkdir -p dist
          APP=$(ls -td build/Crate_artefacts/Release/*.app | head -n 1)
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" "dist/Crate XL-mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Crate-XL-macOS
          path: dist/Crate XL-mac.zip

  # Puts the three downloads on the "builds" branch (and a "Latest build" release),
  # so they can be fetched like any other file in the repository.
  publish:
    needs: [android, windows, macos]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Commit to the builds branch
        run: |
          mkdir site && cd site
          git init -q -b builds
          find ../out -type f \( -name "*.apk" -o -name "*.exe" -o -name "*.zip" \) -exec cp {} . \;
          ls -la
          git config user.name "Crate XL build"
          git config user.email "builds@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" builds
      - name: Latest build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-build -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create latest-build site/* -R "$GITHUB_REPOSITORY" --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Android: Crate XL.apk. Windows: Crate XL.exe. macOS: Crate XL-mac.zip." --latest
